services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        TORCH: ${TORCH:-cpu}
    container_name: ore-seg-backend
    env_file:
      - .env
    environment:
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      # Persists raw_images / sam_output_images / checkpoints across rebuilds
      # (checkpoints are .dockerignore'd from the image itself)
      - ./backend/assets:/app/backend/assets
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/dimensions/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    networks:
      - ore-seg-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ore-seg-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - ore-seg-net

networks:
  ore-seg-net:
    driver: bridge
